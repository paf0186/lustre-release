\* @model: ldlm_lock_order_audit
\* @expect: pass
\* @description: Convert acquires ns_lock while holding res_lock (nested), but this follows the documented ordering (res > ns = high-to-low). Without a concurrent path taking them in opposite order, no deadlock or inversion occurs. Confirms convert's order alone is safe.
SPECIFICATION Spec

CONSTANTS
    InjectBugConvertNsNested = TRUE
    InjectBugCancelNested = FALSE
    InjectBugWaitExpNested = FALSE

INVARIANTS
    TypeOK
    NoDeadlock
    NoLockOrderInversion

PROPERTIES
    Termination

CHECK_DEADLOCK FALSE
