\* @model: dne_striped_dir_ops
\* @lu: 4725, 11104
\* @constant: InjectBugLockOrder = TRUE
\* @expect: fail
\* @violated: Termination
\* @timeout: 30m
\* @description: Lock ordering bug - ops acquire locks in source-first order causing deadlock (LU-4725, LU-11104)
SPECIFICATION Spec

\* Two concurrent cross-MDT mkdirs with opposite master/remote MDTs.
\* With buggy lock ordering (source-first), they can deadlock:
\*   Op1 holds lock on MDT1, waits for MDT2
\*   Op2 holds lock on MDT2, waits for MDT1

CONSTANTS
    Op1Type = "mkdir"
    Op2Type = "mkdir"
    Op1MasterMdt = 1
    Op1RemoteMdt = 2
    Op2MasterMdt = 2
    Op2RemoteMdt = 1
    InjectBugLockOrder = TRUE
    InjectBugNoRecovery = FALSE
    InjectBugPartialPhase1 = FALSE
    EnableCrash = FALSE

INVARIANTS
    TypeOK
    NoLocksHeldByDone
    NoNegativeEntries

PROPERTIES
    Termination
