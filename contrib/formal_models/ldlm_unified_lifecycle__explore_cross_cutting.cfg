\* @model: ldlm_unified_lifecycle
\* @expect: pass
\* @description: Cross-cutting race check - no violation after ServerCancel fix
\* @timeout: 30m
\*
\* Previously expected NoGrantDuringCallback violation: the server would
\* process cancel (remove H, trigger reprocess) and grant W while H's
\* BL_AST callback was still executing. This was a MODEL ARTIFACT -- the
\* server incorrectly awaited h_fl_CANCEL instead of h_fl_BL_DONE.
\*
\* Fixed 2026-03-13: ServerCancel now waits for h_fl_BL_DONE, matching
\* real code where the cancel RPC is only sent after osc_cache_writeback_range
\* (hp=1) completes synchronously. The server cannot race the callback.
SPECIFICATION Spec

CONSTANTS
    InjectBug8391 = FALSE
    InjectBug8246 = FALSE
    InjectBug6416 = FALSE
    InjectBugNoWait = FALSE
    InjectBugNoRestart = FALSE

INVARIANTS
    TypeOK
    NoDoubleServerGrant
    NoDoubleClientGrant
    ServerPoolCorrect
    ClientPoolCorrect
    FlagConsistency
    CancelCallbackOnce
    BLDoneImpliesCancel
    NoCancelledOnWaiting
    NoGrantWhileHeld
    CancelPostCondition
    TotalGrantCorrect
    GrantBalanced
    \* Cross-cutting invariants
    NoGrantWhileBLASTPending
    NoGrantDuringCallback
    CancelImpliesNotWaiting
    BLDoneBeforeClientGrant

CHECK_DEADLOCK FALSE
