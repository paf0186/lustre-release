\* @model: recovery_model_multiclient
\* @lu:
\* @constant: InjectBugGlobalVBR = FALSE
\* @expect: pass
\* @violated:
\* @description: Per-client VBR committed set prevents cross-client transno collision.
\*   Each client's VBR check uses only its own committed transnos, matching real
\*   Lustre per-export behavior.  Fixes the global VBR false-match bug.
SPECIFICATION Spec

CONSTANTS
    c1 = c1
    c2 = c2
    Clients = {c1, c2}
    MaxRequests = 1
    MaxTransno = 3
    MaxEpoch = 2
    InjectBugNoWaitAll = FALSE
    InjectBugMidReplayEvict = FALSE
    InjectBugGlobalVBR = FALSE

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    EvictedClientNotReplaying
    NoPartialCommit
    NoLostReplay
    ReplayedEpochMatch
    NoDoubleReplay
    ClientEpochBound
    ReplayImpliesRecovering
    VBRIntegrityAcrossClients
    NoSplitBrainRecovery
    ReplayCompleteness
    ConsistentRecoveryTermination

PROPERTIES
    RecoveryCompletesEventually
