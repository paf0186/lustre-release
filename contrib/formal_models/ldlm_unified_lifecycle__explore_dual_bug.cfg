\* @model: ldlm_unified_lifecycle
\* @expect: fail
\* @violated: CancelImpliesNotWaiting
\* @description: Dual bug injection (8391+6416) - cross-cutting interaction between resource change and cancel re-add
\* @timeout: 30m
\* Injects LU-8391 (missing granted check after resource change) and
\* LU-6416 (add_waiting_lock doesn't check CANCEL) simultaneously.
\* The combination stresses the resource change window while cancel
\* state management is broken -- tests whether cross-cutting invariants
\* detect the interaction.
SPECIFICATION Spec

CONSTANTS
    InjectBug8391 = TRUE
    InjectBug8246 = FALSE
    InjectBug6416 = TRUE
    InjectBugNoWait = FALSE
    InjectBugNoRestart = FALSE

INVARIANTS
    TypeOK
    NoDoubleServerGrant
    NoDoubleClientGrant
    ServerPoolCorrect
    ClientPoolCorrect
    FlagConsistency
    CancelCallbackOnce
    BLDoneImpliesCancel
    NoCancelledOnWaiting
    NoGrantWhileHeld
    CancelPostCondition
    TotalGrantCorrect
    GrantBalanced
    \* Cross-cutting invariants
    NoGrantWhileBLASTPending
    NoGrantDuringCallback
    CancelImpliesNotWaiting
    BLDoneBeforeClientGrant

CHECK_DEADLOCK FALSE
