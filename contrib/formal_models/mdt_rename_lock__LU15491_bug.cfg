\* @model: mdt_rename_lock
\* @lu: 15491
\* @constant: InjectBug15491 = TRUE
\* @expect: fail
\* @violated: deadlock
\* @description: Cross-dir rename deadlock via hardlinks - child locks without FID ordering
SPECIFICATION Spec

\* Scenario: R1 renames dir1/a->dir1/b (child 3->4) same-dir rename
\*           R2 renames dir2/c->dir2/d (child 4->3, hardlinks) same-dir rename
\*           No PDO or dir_lock contention (different dirs, different hashes).
\*           Without FID ordering on child locks:
\*             R1 locks child 3 then 4 (src then tgt)
\*             R2 locks child 4 then 3 (src then tgt)
\*           -> ABBA deadlock on child locks

CONSTANTS
    InjectBug15285 = FALSE
    InjectBug15491 = TRUE
    InjectBug4725 = FALSE
    InjectBug11104 = FALSE
    UseBFL = FALSE
    R1_SrcDir = 1
    R1_TgtDir = 1
    R1_SrcHash = 1
    R1_TgtHash = 2
    R1_SrcChild = 3
    R1_TgtChild = 4
    R2_SrcDir = 2
    R2_TgtDir = 2
    R2_SrcHash = 3
    R2_TgtHash = 4
    R2_SrcChild = 4
    R2_TgtChild = 3

INVARIANTS
    TypeOK
    NoLocksHeldByDone

PROPERTIES
    Termination
