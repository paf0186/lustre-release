\* @model: mdt_rename_lock
\* @lu: 11104
\* @constant: InjectBug11104 = TRUE
\* @expect: fail
\* @violated: deadlock
\* @description: Striped dir rename deadlock - stripe locks without index ordering
SPECIFICATION Spec

\* Scenario: dir1 and dir2 are stripes of the same striped directory.
\*           R1 renames from stripe dir2 to stripe dir1
\*           R2 renames from stripe dir1 to stripe dir2
\*           Without stripe index (FID) ordering:
\*             R1 locks dir2 then dir1
\*             R2 locks dir1 then dir2
\*           -> ABBA deadlock (same mechanism as LU-4725)

CONSTANTS
    InjectBug15285 = FALSE
    InjectBug15491 = FALSE
    InjectBug4725 = FALSE
    InjectBug11104 = TRUE
    UseBFL = FALSE
    R1_SrcDir = 2
    R1_TgtDir = 1
    R1_SrcHash = 3
    R1_TgtHash = 1
    R1_SrcChild = 3
    R1_TgtChild = 4
    R2_SrcDir = 1
    R2_TgtDir = 2
    R2_SrcHash = 2
    R2_TgtHash = 4
    R2_SrcChild = 5
    R2_TgtChild = 6

INVARIANTS
    TypeOK
    NoLocksHeldByDone

PROPERTIES
    Termination
