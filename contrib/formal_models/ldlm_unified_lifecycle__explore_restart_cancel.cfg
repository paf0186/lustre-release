\* @model: ldlm_unified_lifecycle
\* @expect: pass
\* @description: Restart/cancel race check - no violation after ServerCancel fix
\* @timeout: 30m
\* InjectBugNoRestart skips ERESTART rescan. Previously expected
\* NoGrantDuringCallback violation, but the race was a model artifact:
\* ServerCancel awaited h_fl_CANCEL instead of h_fl_BL_DONE.
\* Fixed 2026-03-13: cancel RPC requires BL_DONE (sync writeback done).
SPECIFICATION Spec

CONSTANTS
    InjectBug8391 = FALSE
    InjectBug8246 = FALSE
    InjectBug6416 = FALSE
    InjectBugNoWait = FALSE
    InjectBugNoRestart = TRUE

INVARIANTS
    TypeOK
    NoDoubleServerGrant
    NoDoubleClientGrant
    ServerPoolCorrect
    ClientPoolCorrect
    FlagConsistency
    CancelCallbackOnce
    BLDoneImpliesCancel
    NoCancelledOnWaiting
    NoGrantWhileHeld
    CancelPostCondition
    TotalGrantCorrect
    GrantBalanced
    \* Cross-cutting invariants
    NoGrantWhileBLASTPending
    NoGrantDuringCallback
    CancelImpliesNotWaiting
    BLDoneBeforeClientGrant

CHECK_DEADLOCK FALSE
