\* @model: recovery_model_multiclient
\* @lu:
\* @constant: InjectBugNoWaitAll = TRUE
\* @expect: fail
\* @violated: ReplayCompleteness
\* @description: NoWaitAll bug with ReplayCompleteness invariant.  Server completes
\*   recovery after one client finishes replay, leaving another client's committed
\*   requests un-replayed.  ReplayCompleteness catches this: a FULL client has
\*   committed requests that never reached "replayed" status.
SPECIFICATION Spec

CONSTANTS
    c1 = c1
    c2 = c2
    Clients = {c1, c2}
    MaxRequests = 1
    MaxTransno = 3
    MaxEpoch = 2
    InjectBugNoWaitAll = TRUE
    InjectBugMidReplayEvict = FALSE
    InjectBugGlobalVBR = TRUE

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    ReplayCompleteness

PROPERTIES
    RecoveryCompletesEventually
