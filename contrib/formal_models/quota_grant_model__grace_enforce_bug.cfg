\* @model: quota_grant_model
\* @expect: fail
\* @violated: EffectiveLimitInvariant
\* @lu: 19503, 18612
\* @constant: InjectBugGraceEnforce = TRUE
\* @description: Bug - QMT ignores grace period expiry and continues granting up to QMT_LIMIT
\*               instead of SOFT_LIMIT; user exceeds soft limit after grace timer elapsed.
\*               Matches LU-19503 "soft limit not working" and LU-18612 stale over-softlimit flag
\* @states: 10M
\* @timeout: 15m
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Client1 = Client1
    Client2 = Client2
    Clients = {Client1, Client2}
    QMT_LIMIT = 6
    MAX_CLIENT_GRANT = 3
    MAX_INUSE = 2
    SOFT_LIMIT = 4
    ADMIN_LIMIT = 6
    QMT_SOFT_LIMIT = 0
    EnableRebalance = FALSE
    InjectBugReplenishRace = FALSE
    InjectBugRebalanceDouble = FALSE
    InjectBugRebalanceLoss = FALSE
    InjectBugGraceEnforce = TRUE
    InjectBugUncheckedAcquire = FALSE
    InjectBugStaleGrant = FALSE
    InjectBugSoftLimit = FALSE
    InjectBugBrwSync = FALSE

SYMMETRY Symmetry

INVARIANTS
    HardLimitInvariant
    ConservationInvariant
    NonNegative
    InUseBounded
    EffectiveLimitInvariant
