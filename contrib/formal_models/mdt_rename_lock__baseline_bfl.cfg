\* @model: mdt_rename_lock
\* @lu:
\* @constant: UseBFL = TRUE
\* @expect: pass
\* @violated:
\* @description: BFL serializes renames - no deadlock even with buggy ordering
SPECIFICATION Spec

\* When the BFL is held, even buggy lock ordering cannot deadlock
\* because only one rename runs at a time. This verifies the BFL
\* was sufficient before parallel rename was enabled.

CONSTANTS
    InjectBug15285 = TRUE
    InjectBug15491 = TRUE
    InjectBug4725 = FALSE
    InjectBug11104 = FALSE
    UseBFL = TRUE
    R1_SrcDir = 1
    R1_TgtDir = 1
    R1_SrcHash = 1
    R1_TgtHash = 2
    R1_SrcChild = 3
    R1_TgtChild = 4
    R2_SrcDir = 1
    R2_TgtDir = 1
    R2_SrcHash = 2
    R2_TgtHash = 1
    R2_SrcChild = 4
    R2_TgtChild = 3

INVARIANTS
    TypeOK
    NoLocksHeldByDone

PROPERTIES
    Termination
