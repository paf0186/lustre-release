\* @model: ldlm_lock_order_audit
\* @expect: fail
\* @violated: NoLockOrderInversion
\* @description: Bug -- cancel holds ns_lock (rank 2) while acquiring res_lock (rank 4), which is a lock order inversion (acquiring higher-ranked lock while holding lower-ranked). Convert follows correct order. Detects the cancel-side ordering violation independently.
SPECIFICATION Spec

CONSTANTS
    InjectBugConvertNsNested = FALSE
    InjectBugCancelNested = TRUE
    InjectBugWaitExpNested = FALSE

INVARIANTS
    TypeOK
    NoDeadlock
    NoLockOrderInversion

CHECK_DEADLOCK FALSE
