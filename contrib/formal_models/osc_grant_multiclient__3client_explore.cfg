\* @model: osc_grant_multiclient
\* @expect: pass
\* @description: Exploration - 3 clients competing for tight grant pool, stress pool exhaustion and shrink balancing
\* @states: 10M
\* @timeout: 15m
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Client1 = Client1
    Client2 = Client2
    Client3 = Client3
    Clients = {Client1, Client2, Client3}
    SERVER_TOTAL = 5
    MAX_CLIENT_GRANT = 3
    InjectBugShrinkRace = FALSE
    InjectBugEvictShrinkDoubleCount = FALSE
    InjectBugEvictNoReclaim = FALSE

SYMMETRY Symmetry

INVARIANTS
    GrantSafetyInvariant
    GrantsNonNegative
    GrantsBounded
    ShrinkNonNegative
    PendingShrinkNonNegative
    ServerGrantedBounded
    ServerGrantedNonNeg
    ServerTrackingConsistent
    EvictedClientClean
    ConnectedNotEvicted
    DisconnectedNoGrant
    GrantPoolNonNegative
    CrossClientShrinkSafety

