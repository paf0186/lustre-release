\* @model: recovery_model
\* @lu: 10251
\* @constant: MaxRequests=2, MaxTransno=3, MaxEpoch=2, InjectEarlyExit=TRUE
\* @expect: fail
\* @violated: ReplayImpliesRecovering
\* @description: Bug C -- early recovery exit: the server clears srv_recovering
\*               before srv_replay_complete is set, leaving clients that are
\*               still in REPLAY state with no recovery context on the server.
\*               ReplayImpliesRecovering (cli_state="REPLAY" => srv_recovering)
\*               fires in the state immediately after ServerExitRecoveryEarly.
\*               Real LU: LU-10251 -- "MDS hangs in recovery, recovery timer
\*               is bogus": server enters a state where it cannot complete
\*               recovery; early exit is the symmetric failure mode.
\*               Also related: LU-19601 -- replay-dual test: recovery never
\*               aborts on 5.14 kernel.
SPECIFICATION Spec

CONSTANTS
    MaxRequests = 2
    MaxTransno = 3
    MaxEpoch = 2
    InjectDoubleReplay = FALSE
    InjectEpochBypass = FALSE
    InjectEarlyExit = TRUE
    InjectEvictionRace = FALSE

INVARIANTS
    TypeOK
    ReplayedEpochMatch
    NoDoubleReplay
    ClientEpochBound
    ReplayImpliesRecovering
    RecoveryPreservesCommits
    NoReplayOfUnsent
    NoEvictionDuringReplay

PROPERTIES
    EventuallyDone

