\* @model: quota_grant_model
\* @expect: fail
\* @violated: HardLimitInvariant
\* @lu: 14764
\* @constant: InjectBugRebalanceDouble = TRUE
\* @description: Bug - QMT counts pending rebalance shrink as headroom; grants to Client2
\*               while Client1's shrink response is delayed, pushing qmt_granted above QMT_LIMIT.
\*               Matches LU-14764 single OST quotas out of sync
\* @states: 10M
\* @timeout: 15m
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Client1 = Client1
    Client2 = Client2
    Clients = {Client1, Client2}
    QMT_LIMIT = 6
    MAX_CLIENT_GRANT = 3
    MAX_INUSE = 2
    SOFT_LIMIT = 0
    ADMIN_LIMIT = 6
    QMT_SOFT_LIMIT = 0
    EnableRebalance = TRUE
    InjectBugReplenishRace = FALSE
    InjectBugRebalanceDouble = TRUE
    InjectBugRebalanceLoss = FALSE
    InjectBugGraceEnforce = FALSE
    InjectBugUncheckedAcquire = FALSE
    InjectBugStaleGrant = FALSE
    InjectBugSoftLimit = FALSE
    InjectBugBrwSync = FALSE

SYMMETRY Symmetry

INVARIANTS
    HardLimitInvariant
    ConservationInvariant
    NonNegative
    InUseBounded
    PoolTotalInvariant
