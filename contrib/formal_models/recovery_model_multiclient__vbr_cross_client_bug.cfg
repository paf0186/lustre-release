\* @model: recovery_model_multiclient
\* @lu:
\* @constant: InjectBugGlobalVBR = TRUE
\* @expect: fail
\* @violated: VBRIntegrityAcrossClients
\* @description: Global VBR committed set allows cross-client transno collision.
\*   Client A's committed transno validates Client B's uncommitted request replay.
\*   In real Lustre, committed sets are per-export (per-client), preventing this.
SPECIFICATION Spec

CONSTANTS
    c1 = c1
    c2 = c2
    Clients = {c1, c2}
    MaxRequests = 1
    MaxTransno = 3
    MaxEpoch = 2
    InjectBugNoWaitAll = FALSE
    InjectBugMidReplayEvict = FALSE
    InjectBugGlobalVBR = TRUE

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    VBRIntegrityAcrossClients

PROPERTIES
    RecoveryCompletesEventually
