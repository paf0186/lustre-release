\* @model: lov_pfl_layout
\* @expect: pass
\* @description: Exploration -- all invariants enabled, no bugs injected.
\*               Checks the full set of safety properties with correct code.
\*               Pool race (NoWriteToRemovedTarget) is excluded here since
\*               it's a known gap in the existing architecture.
\*               This cfg searches for novel races in the layout change +
\*               I/O interaction beyond the known LU-9839 and LU-18435 bugs.
SPECIFICATION Spec

CONSTANTS
    InjectBug9839 = FALSE
    InjectBug18435 = FALSE
    NumComponents = 2

INVARIANTS
    TypeOK
    LayoutGenMonotonic
    NoWriteToInactive
    NoLayoutChangeWithActiveIO

PROPERTIES
    AllComplete
    Termination

CHECK_DEADLOCK FALSE
