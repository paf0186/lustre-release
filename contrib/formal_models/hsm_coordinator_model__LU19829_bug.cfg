\* @model: hsm_coordinator_model
\* @lu: 19829
\* @constant: InjectLU19829 = TRUE
\* @expect: fail
\* @violated: AtMostOneStartedPerFID
\* @description: LU-19829 bug: archive dedup guard removed in 2.15. Coordinator can
\*               dispatch two concurrent archive requests for the same FID (NumFids=1
\*               forces all requests to share FID 1). Both become STARTED, violating
\*               AtMostOneStartedPerFID and enabling data-loss via concurrent writes.
\*               NumFids=1 ensures all requests share the same FID.
SPECIFICATION Spec

CONSTANTS
    NumRequests = 2
    NumFids = 1
    InjectLU19579 = FALSE
    InjectLU19829 = TRUE

INVARIANTS
    TypeOK
    NoDoneRedispatch
    CanceledNoAgent
    StartedHasAgent
    AtMostOneStartedPerFID

