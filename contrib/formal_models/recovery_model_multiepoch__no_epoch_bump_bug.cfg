\* @model: recovery_model_multiepoch
\* @lu:
\* @constant: InjectNoEpochBump=TRUE
\* @expect: fail
\* @violated: UncommittedNeverReplayed
\* @description: Bug injection -- server restart does not bump epoch, causing uncommitted requests to be replayed via epoch match (data corruption risk)
SPECIFICATION Spec

CONSTANTS
    MaxRequests = 2
    MaxTransno = 3
    MaxEpoch = 3
    MaxRestarts = 2
    InjectStrictEpochMatch = FALSE
    InjectPartialPersist = FALSE
    InjectNoEpochBump = TRUE

INVARIANTS
    TypeOK
    ReplayedEpochMatch
    NoDoubleReplay
    ClientEpochBound
    ReplayImpliesRecovering
    RecoveryPreservesCommits
    NoReplayOfUnsent
    EpochGapHandled
    SkippedEpochOpsNeverReplayed
    EpochMonotonicReplay
    NoReplayAgainstWrongEpoch
    CommittedSetIntegrity
    UncommittedNeverReplayed
    ServerTransnoConsistent

PROPERTIES
    EventuallyDone
