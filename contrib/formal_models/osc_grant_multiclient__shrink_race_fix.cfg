\* @model: osc_grant_multiclient
\* @expect: pass
\* @constant: InjectBugShrinkRace = FALSE
\* @description: Fix - server uses conservative grant calculation (no pending shrink assumption); sum(cl_grant) <= SERVER_TOTAL always holds
\* @states: 5M
\* @timeout: 10m
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Client1 = Client1
    Client2 = Client2
    Clients = {Client1, Client2}
    SERVER_TOTAL = 6
    MAX_CLIENT_GRANT = 4
    InjectBugShrinkRace = FALSE
    InjectBugEvictShrinkDoubleCount = FALSE
    InjectBugEvictNoReclaim = FALSE

SYMMETRY Symmetry

INVARIANTS
    GrantSafetyInvariant
    GrantsNonNegative
    GrantsBounded
    ShrinkNonNegative
    PendingShrinkNonNegative
    ServerGrantedBounded
    ServerGrantedNonNeg
    ServerTrackingConsistent

