\* @model: quota_grant_model
\* @expect: pass
\* @constant: InjectBugRebalanceDouble = FALSE
\* @description: Fix - QMT uses confirmed qmt_granted only; pending rebalance shrinks
\*               do not inflate headroom for new grants
\* @states: 10M
\* @timeout: 15m
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Client1 = Client1
    Client2 = Client2
    Clients = {Client1, Client2}
    QMT_LIMIT = 6
    MAX_CLIENT_GRANT = 3
    MAX_INUSE = 2
    SOFT_LIMIT = 0
    ADMIN_LIMIT = 6
    QMT_SOFT_LIMIT = 0
    EnableRebalance = TRUE
    InjectBugReplenishRace = FALSE
    InjectBugRebalanceDouble = FALSE
    InjectBugRebalanceLoss = FALSE
    InjectBugGraceEnforce = FALSE
    InjectBugUncheckedAcquire = FALSE
    InjectBugStaleGrant = FALSE
    InjectBugSoftLimit = FALSE
    InjectBugBrwSync = FALSE

SYMMETRY Symmetry

INVARIANTS
    HardLimitInvariant
    ConservationInvariant
    NonNegative
    InUseBounded
    PoolTotalInvariant
