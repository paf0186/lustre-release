\* @model: mds_unlink_orphan_model
\* @expect: pass
\* @timeout: 60m
\* @states: 50M
\* @description: Combined: 2 hardlinks + 2 clients + 2 OSTs + 1 crash. Hardlink unlink races with concurrent open/close.
SPECIFICATION Spec

CONSTANTS
    NumOSTs = 2
    MaxNlink = 2
    NumClients = 2
    MaxCrashes = 1
    EnableOSTFailure = FALSE
    MaxOSTFailures = 0
    InjectBugSkipOrphan = FALSE
    InjectBugDoubleDestroy = FALSE
    InjectBugSkipLlogClear = FALSE
    InjectBugDestroyOnIntermediateUnlink = FALSE
    InjectBugSkipOSTAvailCheck = FALSE
    InjectBugCrashKeepsClients = FALSE

INVARIANTS
    TypeOK
    AllSafety

PROPERTIES
    Termination
    EventualDestroy
    NoOrphanLeak
