\* @model: changelog_consumer
\* @lu: 19411
\* @constant: InjectBug19411 = FALSE
\* @constant: LogCount = 3, CatFreeSlots = 0, SpaceThreshold = 5
\* @expect: pass
\* @violated:
\* @description: LU-19411 fix -- GC decision uses LogCount (llh_count, the actual number
\*               of plain llogs in use) instead of CatFreeSlots (llog_cat_free_space()).
\*               With LogCount = 3 <= SpaceThreshold = 5, GC does not trigger even when
\*               CatFreeSlots = 0. GC only fires when LogCount genuinely exceeds the
\*               threshold, proving the fix eliminates spurious GC triggering.
\*               Fix matches: "changelog size estimation can be too pessimistic" (LU-19411).
SPECIFICATION Spec

CONSTANTS
    LogCount = 3
    CatFreeSlots = 0
    SpaceThreshold = 5
    InjectBug18552 = FALSE
    InjectBug19411 = FALSE

INVARIANTS
    TypeOK
    NoAccessWhileUninit
    NoFalseGC
    InitComplete

PROPERTIES
    AllComplete

CHECK_DEADLOCK FALSE
