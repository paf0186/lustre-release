\* @model: dne_striped_dir_ops
\* @lu: 4725, 11104
\* @constant: InjectBugLockOrder = TRUE
\* @expect: fail
\* @violated: Termination
\* @timeout: 30m
\* @description: Concurrent cross-MDT rmdirs with buggy lock ordering - deadlock on stripe locks
SPECIFICATION Spec

\* Two concurrent rmdir operations on different stripes of the same
\* striped directory. With buggy lock ordering (source-first), they
\* can deadlock on both parent and stripe locks.

CONSTANTS
    Op1Type = "rmdir"
    Op2Type = "rmdir"
    Op1MasterMdt = 1
    Op1RemoteMdt = 2
    Op2MasterMdt = 2
    Op2RemoteMdt = 1
    InjectBugLockOrder = TRUE
    InjectBugNoRecovery = FALSE
    InjectBugPartialPhase1 = FALSE
    EnableCrash = FALSE

INVARIANTS
    TypeOK
    NoLocksHeldByDone
    NoNegativeEntries

PROPERTIES
    Termination
