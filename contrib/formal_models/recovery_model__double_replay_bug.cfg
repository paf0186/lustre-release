\* @model: recovery_model
\* @lu: no known LU- match (2026-03-12 search)
\* @constant: MaxRequests=2, MaxTransno=3, MaxEpoch=2, InjectDoubleReplay=TRUE
\* @expect: fail
\* @violated: NoDoubleReplay
\* @description: Bug A -- double replay: client fails to update cli_replaying
\*               after sending a replay RPC.  The deduplication tracking is
\*               omitted, so req_status is set to "replayed" but r never
\*               appears in cli_replaying.  NoDoubleReplay fires because
\*               req_status[r]="replayed" does not imply r \in cli_replaying.
\*               No direct LU match found (2026-03-12 JIRA search).
\*               Conceptually related to LU-6928 and LU-2257 (replay
\*               bookkeeping failures leading to version mismatch).
SPECIFICATION Spec

CONSTANTS
    MaxRequests = 2
    MaxTransno = 3
    MaxEpoch = 2
    InjectDoubleReplay = TRUE
    InjectEpochBypass = FALSE
    InjectEarlyExit = FALSE
    InjectEvictionRace = FALSE

INVARIANTS
    TypeOK
    ReplayedEpochMatch
    NoDoubleReplay
    ClientEpochBound
    ReplayImpliesRecovering
    RecoveryPreservesCommits
    NoReplayOfUnsent
    NoEvictionDuringReplay

PROPERTIES
    EventuallyDone

