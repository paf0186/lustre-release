\* @model: changelog_consumer
\* @lu: 18552
\* @constant: InjectBug18552 = TRUE
\* @expect: fail
\* @violated: NoAccessWhileUninit
\* @description: LU-18552 bug -- mdd_changelog_recalc_mask() accesses mdd->mdd_cl
\*               without serializing with the init path. Reader can run while writer
\*               is in the UNINIT or INIT state, dereferencing a NULL/partial pointer
\*               (kernel panic at mdd_changelog_recalc_mask+0xd4).
\*               TLC finds: reader fires R_Start before writer reaches W_SetActive,
\*               setting reader_saw_null = TRUE and violating NoAccessWhileUninit.
SPECIFICATION Spec

CONSTANTS
    LogCount = 3
    CatFreeSlots = 4
    SpaceThreshold = 5
    InjectBug18552 = TRUE
    InjectBug19411 = FALSE

INVARIANTS
    TypeOK
    NoAccessWhileUninit
    NoFalseGC
    InitComplete

PROPERTIES
    AllComplete

CHECK_DEADLOCK FALSE
