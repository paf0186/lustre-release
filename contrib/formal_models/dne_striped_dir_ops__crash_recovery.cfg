\* @model: dne_striped_dir_ops
\* @lu:
\* @constant: EnableCrash = TRUE
\* @expect: pass
\* @violated:
\* @timeout: 30m
\* @description: Crash between Phase1 and Phase2 with correct recovery - entries consistent after recovery
SPECIFICATION Spec

\* A crash can occur after master commits but before remote commits.
\* Recovery reads the update log and re-drives the remote operation.
\* Entry counts should be consistent after recovery completes.

CONSTANTS
    Op1Type = "mkdir"
    Op2Type = "mkdir"
    Op1MasterMdt = 1
    Op1RemoteMdt = 2
    Op2MasterMdt = 2
    Op2RemoteMdt = 1
    InjectBugLockOrder = FALSE
    InjectBugNoRecovery = FALSE
    InjectBugPartialPhase1 = FALSE
    EnableCrash = TRUE

INVARIANTS
    TypeOK
    NoLocksHeldByDone
    EntryCountConsistent
    NoOrphansAfterRecovery
    NoNegativeEntries

PROPERTIES
    Termination
