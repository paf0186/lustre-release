\* @model: quota_grant_model
\* @expect: fail
\* @violated: HardLimitInvariant
\* @constant: InjectBugReplenishRace = TRUE
\* @description: Bug - QMT counts pending reclaim as headroom when granting;
\*               qmt_granted can exceed QMT_LIMIT before reclaim arrives
\* @states: 5M
\* @timeout: 10m
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Client1 = Client1
    Client2 = Client2
    Clients = {Client1, Client2}
    QMT_LIMIT = 20
    MAX_CLIENT_GRANT = 8
    MAX_INUSE = 4
    SOFT_LIMIT = 0
    ADMIN_LIMIT = 20
    QMT_SOFT_LIMIT = 0
    EnableRebalance = FALSE
    InjectBugReplenishRace = TRUE
    InjectBugRebalanceDouble = FALSE
    InjectBugRebalanceLoss = FALSE
    InjectBugGraceEnforce = FALSE
    InjectBugUncheckedAcquire = FALSE
    InjectBugStaleGrant = FALSE
    InjectBugSoftLimit = FALSE
    InjectBugBrwSync = FALSE

SYMMETRY Symmetry

INVARIANTS
    HardLimitInvariant
    ConservationInvariant
    NonNegative
    InUseBounded
