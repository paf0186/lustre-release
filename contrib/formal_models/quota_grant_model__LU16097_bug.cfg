\* @model: quota_grant_model
\* @lu: 16097
\* @expect: fail
\* @violated: AdminLimitInvariant
\* @constant: InjectBugStaleGrant = TRUE
\* @description: Bug - admin reduces quota limit to ADMIN_LIMIT=10 but QMT still grants
\*               up to QMT_LIMIT=20; pre-acquired grants are not reclaimed
\* @states: 5M
\* @timeout: 10m
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Client1 = Client1
    Client2 = Client2
    Clients = {Client1, Client2}
    QMT_LIMIT = 20
    MAX_CLIENT_GRANT = 8
    MAX_INUSE = 4
    SOFT_LIMIT = 0
    ADMIN_LIMIT = 10
    QMT_SOFT_LIMIT = 0
    EnableRebalance = FALSE
    InjectBugReplenishRace = FALSE
    InjectBugRebalanceDouble = FALSE
    InjectBugRebalanceLoss = FALSE
    InjectBugGraceEnforce = FALSE
    InjectBugUncheckedAcquire = FALSE
    InjectBugStaleGrant = TRUE
    InjectBugSoftLimit = FALSE
    InjectBugBrwSync = FALSE

SYMMETRY Symmetry

INVARIANTS
    AdminLimitInvariant
    ConservationInvariant
    NonNegative
    InUseBounded
