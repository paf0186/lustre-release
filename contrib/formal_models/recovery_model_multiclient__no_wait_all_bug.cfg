SPECIFICATION Spec

CONSTANTS
    c1 = c1
    c2 = c2
    Clients = {c1, c2}
    MaxRequests = 1
    MaxTransno = 3
    MaxEpoch = 2
    InjectBugNoWaitAll = TRUE
