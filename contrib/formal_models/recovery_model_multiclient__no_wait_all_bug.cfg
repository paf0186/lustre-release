SYMMETRY Symmetry

INVARIANTS
    TypeOK
    EvictedClientNotReplaying
    NoPartialCommit
    NoLostReplay
    ReplayedEpochMatch
    NoDoubleReplay
    ClientEpochBound
    ReplayImpliesRecovering

PROPERTIES
    RecoveryCompletesEventually
