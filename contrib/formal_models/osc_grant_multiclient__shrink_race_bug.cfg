\* @model: osc_grant_multiclient
\* @expect: fail
\* @violated: GrantSafetyInvariant
\* @constant: InjectBugShrinkRace = TRUE
\* @description: Bug - server grants to Client2 assuming pending shrink to Client1 already took effect; sum(cl_grant) > SERVER_TOTAL
\* @states: 5M
\* @timeout: 10m
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Client1 = Client1
    Client2 = Client2
    Clients = {Client1, Client2}
    SERVER_TOTAL = 6
    MAX_CLIENT_GRANT = 4
    InjectBugShrinkRace = TRUE
    InjectBugEvictShrinkDoubleCount = FALSE
    InjectBugEvictNoReclaim = FALSE

SYMMETRY Symmetry

INVARIANTS
    GrantSafetyInvariant
    GrantsNonNegative
    GrantsBounded
    ShrinkNonNegative
    PendingShrinkNonNegative

