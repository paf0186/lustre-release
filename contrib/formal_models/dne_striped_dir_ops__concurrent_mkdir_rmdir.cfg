\* @model: dne_striped_dir_ops
\* @lu:
\* @constant:
\* @expect: pass
\* @violated:
\* @timeout: 30m
\* @description: Concurrent mkdir and rmdir on same striped dir, correct locking, no crash
SPECIFICATION Spec

\* Tests that concurrent mkdir (adding entry) and rmdir (removing entry)
\* on the same striped directory maintain consistent entry counts when
\* lock ordering is correct.

CONSTANTS
    Op1Type = "mkdir"
    Op2Type = "rmdir"
    Op1MasterMdt = 1
    Op1RemoteMdt = 2
    Op2MasterMdt = 1
    Op2RemoteMdt = 2
    InjectBugLockOrder = FALSE
    InjectBugNoRecovery = FALSE
    InjectBugPartialPhase1 = FALSE
    EnableCrash = FALSE

INVARIANTS
    TypeOK
    NoLocksHeldByDone
    EntryCountConsistent
    NoNegativeEntries

PROPERTIES
    Termination
