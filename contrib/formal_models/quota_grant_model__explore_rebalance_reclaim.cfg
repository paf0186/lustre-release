\* @model: quota_grant_model
\* @expect: pass
\* @description: Exploration - rebalance + reclaim interaction; exercises concurrent
\*               shrink requests and reclaim RPCs to verify conservation under contention
\* @states: 20M
\* @timeout: 30m
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Client1 = Client1
    Client2 = Client2
    Clients = {Client1, Client2}
    QMT_LIMIT = 8
    MAX_CLIENT_GRANT = 4
    MAX_INUSE = 2
    SOFT_LIMIT = 0
    ADMIN_LIMIT = 8
    QMT_SOFT_LIMIT = 0
    EnableRebalance = TRUE
    InjectBugReplenishRace = FALSE
    InjectBugRebalanceDouble = FALSE
    InjectBugRebalanceLoss = FALSE
    InjectBugGraceEnforce = FALSE
    InjectBugUncheckedAcquire = FALSE
    InjectBugStaleGrant = FALSE
    InjectBugSoftLimit = FALSE
    InjectBugBrwSync = FALSE

SYMMETRY Symmetry

INVARIANTS
    HardLimitInvariant
    ConservationInvariant
    NonNegative
    InUseBounded
    PoolTotalInvariant
