\* @model: quota_grant_model
\* @lu: 19503
\* @expect: fail
\* @violated: SoftLimitInvariant
\* @constant: InjectBugSoftLimit = TRUE
\* @constant-also: InjectBugBrwSync = FALSE (stray non-comment line fixed 2026-09-10: it made TLC reject the cfg)
\* @description: Bug - grace period has expired (QMT_SOFT_LIMIT=10) but QMT ignores
\*               the soft limit and keeps granting up to ADMIN_LIMIT=20
\* @states: 5M
\* @timeout: 10m
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Client1 = Client1
    Client2 = Client2
    Clients = {Client1, Client2}
    QMT_LIMIT = 20
    MAX_CLIENT_GRANT = 8
    MAX_INUSE = 4
    SOFT_LIMIT = 0
    ADMIN_LIMIT = 20
    QMT_SOFT_LIMIT = 10
    EnableRebalance = FALSE
    InjectBugReplenishRace = FALSE
    InjectBugRebalanceDouble = FALSE
    InjectBugRebalanceLoss = FALSE
    InjectBugGraceEnforce = FALSE
    InjectBugUncheckedAcquire = FALSE
    InjectBugStaleGrant = FALSE
    InjectBugSoftLimit = TRUE
    InjectBugBrwSync = FALSE

SYMMETRY Symmetry

INVARIANTS
    SoftLimitInvariant
    ConservationInvariant
    NonNegative
    InUseBounded
