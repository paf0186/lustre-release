\* @model: recovery_model
\* @lu: 6928
\* @constant: MaxRequests=2, MaxTransno=3, MaxEpoch=2, InjectEpochBypass=TRUE
\* @expect: fail
\* @violated: ReplayedEpochMatch
\* @description: Bug B -- VBR epoch bypass: client skips the epoch/transno
\*               validation and replays every queued request unconditionally.
\*               A stale request (epoch mismatch, transno not in committed set)
\*               gets req_status="replayed" but neither condition in
\*               ReplayedEpochMatch holds, so the invariant fires.
\*               Real LU: LU-6928 -- "Version mismatch during DNE replay":
\*               client sends replay RPC with an epoch/transno pair that no
\*               longer matches the server's committed history, causing
\*               -EOVERFLOW and client eviction.
\*               Also related: LU-2257 (version mismatch in VBR client log
\*               during MDT recovery).
SPECIFICATION Spec

CONSTANTS
    MaxRequests = 2
    MaxTransno = 3
    MaxEpoch = 2
    InjectDoubleReplay = FALSE
    InjectEpochBypass = TRUE
    InjectEarlyExit = FALSE
    InjectEvictionRace = FALSE

INVARIANTS
    TypeOK
    ReplayedEpochMatch
    NoDoubleReplay
    ClientEpochBound
    ReplayImpliesRecovering
    RecoveryPreservesCommits
    NoReplayOfUnsent
    NoEvictionDuringReplay

PROPERTIES
    EventuallyDone

