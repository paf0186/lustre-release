\* @model: changelog_consumer
\* @lu: 19411
\* @constant: InjectBug19411 = TRUE
\* @constant: LogCount = 3, CatFreeSlots = 0, SpaceThreshold = 5
\* @expect: fail
\* @violated: NoFalseGC
\* @description: LU-19411 bug -- mdd_changelog_is_space_safe() uses llog_cat_free_space()
\*               (catalog slot availability) as a space proxy instead of llh_count.
\*               When CatFreeSlots = 0 (all catalog header slots allocated) GC fires,
\*               even though LogCount = 3 is well below SpaceThreshold = 5.
\*               llog_cat_free_space() returning 0 means no new plain llog files can
\*               be created in the catalog -- NOT that existing logs are full.
\*               TLC finds: gc_triggered = TRUE but gc_needed = FALSE (LogCount <= SpaceThreshold),
\*               violating NoFalseGC.
SPECIFICATION Spec

CONSTANTS
    LogCount = 3
    CatFreeSlots = 0
    SpaceThreshold = 5
    InjectBug18552 = FALSE
    InjectBug19411 = TRUE

INVARIANTS
    TypeOK
    NoAccessWhileUninit
    NoFalseGC
    InitComplete

PROPERTIES
    AllComplete

CHECK_DEADLOCK FALSE
