\* @model: osc_grant_multiclient
\* @expect: pass
\* @description: Exploration - 2 clients with evict/reconnect cycles, all invariants, tight pool
\* @states: 5M
\* @timeout: 10m
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Client1 = Client1
    Client2 = Client2
    Clients = {Client1, Client2}
    SERVER_TOTAL = 4
    MAX_CLIENT_GRANT = 3
    InjectBugShrinkRace = FALSE
    InjectBugEvictShrinkDoubleCount = FALSE
    InjectBugEvictNoReclaim = FALSE

SYMMETRY Symmetry

INVARIANTS
    GrantSafetyInvariant
    GrantsNonNegative
    GrantsBounded
    ShrinkNonNegative
    PendingShrinkNonNegative
    ServerGrantedBounded
    ServerGrantedNonNeg
    ServerTrackingConsistent
    EvictedClientClean
    ConnectedNotEvicted
    DisconnectedNoGrant
    GrantPoolNonNegative
    CrossClientShrinkSafety

