\* @model: dne_striped_dir_ops
\* @lu:
\* @constant:
\* @expect: pass
\* @violated:
\* @timeout: 30m
\* @description: Baseline - two concurrent cross-MDT mkdirs with correct lock ordering, no crash
SPECIFICATION Spec

CONSTANTS
    Op1Type = "mkdir"
    Op2Type = "mkdir"
    Op1MasterMdt = 1
    Op1RemoteMdt = 2
    Op2MasterMdt = 2
    Op2RemoteMdt = 1
    InjectBugLockOrder = FALSE
    InjectBugNoRecovery = FALSE
    InjectBugPartialPhase1 = FALSE
    EnableCrash = FALSE

INVARIANTS
    TypeOK
    NoLocksHeldByDone
    EntryCountConsistent
    NoNegativeEntries

PROPERTIES
    Termination
