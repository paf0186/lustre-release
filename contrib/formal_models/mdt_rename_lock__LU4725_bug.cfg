\* @model: mdt_rename_lock
\* @lu: 4725
\* @constant: InjectBug4725 = TRUE
\* @expect: fail
\* @violated: deadlock
\* @description: Cross-dir rename deadlock - parent dir locks without FID ordering
SPECIFICATION Spec

\* Scenario: R1 renames dir2/a->dir1/b (high FID dir to low FID dir)
\*           R2 renames dir1/c->dir2/d (low FID dir to high FID dir)
\*           Without FID ordering on parent dirs:
\*             R1 locks dir2 then dir1 (src then tgt)
\*             R2 locks dir1 then dir2 (src then tgt)
\*           -> ABBA deadlock on parent dir PDO locks

CONSTANTS
    InjectBug15285 = FALSE
    InjectBug15491 = FALSE
    InjectBug4725 = TRUE
    InjectBug11104 = FALSE
    UseBFL = FALSE
    R1_SrcDir = 2
    R1_TgtDir = 1
    R1_SrcHash = 3
    R1_TgtHash = 1
    R1_SrcChild = 3
    R1_TgtChild = 4
    R2_SrcDir = 1
    R2_TgtDir = 2
    R2_SrcHash = 2
    R2_TgtHash = 4
    R2_SrcChild = 5
    R2_TgtChild = 6

INVARIANTS
    TypeOK
    NoLocksHeldByDone

PROPERTIES
    Termination
