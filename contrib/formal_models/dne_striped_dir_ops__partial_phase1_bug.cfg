\* @model: dne_striped_dir_ops
\* @lu:
\* @constant: InjectBugPartialPhase1 = TRUE, EnableCrash = TRUE
\* @expect: fail
\* @violated: EntryCountConsistent
\* @timeout: 30m
\* @description: Master commits Phase1 but skips update log - recovery cannot re-drive remote, entry count inconsistent
SPECIFICATION Spec

\* When the master commits local changes but does not write the
\* update log record, and a crash occurs before Phase 2 completes,
\* recovery has no record to replay. The master side has changes
\* but the remote side does not, leaving an inconsistent entry count.
\* This is a hypothetical gap: in lustre-release master 47638add78 the
\* update log record is written inside the master transaction
\* (top_trans_stop step 1, lustre/target/update_trans.c:953-985) before
\* the master commits, so it cannot occur; the cfg shows what the update
\* log buys.  (An earlier "Gap 1 in mdd_dir.c:3289" comment referred to a
\* note that no longer exists in the tree.)

CONSTANTS
    Op1Type = "mkdir"
    Op2Type = "mkdir"
    Op1MasterMdt = 1
    Op1RemoteMdt = 2
    Op2MasterMdt = 2
    Op2RemoteMdt = 1
    InjectBugLockOrder = FALSE
    InjectBugNoRecovery = FALSE
    InjectBugPartialPhase1 = TRUE
    EnableCrash = TRUE

INVARIANTS
    TypeOK
    NoLocksHeldByDone
    EntryCountConsistent

PROPERTIES
    Termination
