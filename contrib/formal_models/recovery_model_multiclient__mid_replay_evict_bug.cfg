\* @model: recovery_model_multiclient
\* @lu:
\* @constant: InjectBugMidReplayEvict = TRUE
\* @expect: pass
\* @violated:
\* @description: Mid-replay eviction: server evicts a client during active replay
\*   (simulates client timeout).  The client has already replayed some requests,
\*   but this is legitimate -- those replays happened while the client was still
\*   connected.  The refined EvictedClientNotReplaying invariant permits partial
\*   replay for mid-eviction clients: it only requires that replayed requests are
\*   tracked in cli_replaying (i.e., replayed before eviction), and still catches
\*   phantom replays that happen after eviction.
SPECIFICATION Spec

CONSTANTS
    c1 = c1
    c2 = c2
    Clients = {c1, c2}
    MaxRequests = 1
    MaxTransno = 3
    MaxEpoch = 2
    InjectBugNoWaitAll = FALSE
    InjectBugMidReplayEvict = TRUE
    InjectBugGlobalVBR = TRUE

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    EvictedClientNotReplaying

PROPERTIES
    RecoveryCompletesEventually
