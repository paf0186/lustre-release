\* @model: changelog_consumer
\* @lu: 18552
\* @constant: InjectBug18552 = FALSE
\* @expect: pass
\* @violated:
\* @description: LU-18552 fix -- reader serializes with the init path by awaiting
\*               cl_state = ACTIVE or UNINIT before accessing mdd->mdd_cl.
\*               INIT state (writer mid-initialization) blocks reader progress.
\*               UNINIT state is a safe no-op (no consumer registered).
\*               Fix matches: "mdd: serialize changelog init vs access" (Gerrit 57421).
SPECIFICATION Spec

CONSTANTS
    LogCount = 3
    CatFreeSlots = 4
    SpaceThreshold = 5
    InjectBug18552 = FALSE
    InjectBug19411 = FALSE

INVARIANTS
    TypeOK
    NoAccessWhileUninit
    NoFalseGC
    InitComplete

PROPERTIES
    AllComplete

CHECK_DEADLOCK FALSE
