\* @model: ldlm_unified_lifecycle
\* @expect: pass
\* @description: Cancel/grant race with NoWait bug - no violation after ServerCancel fix
\* @timeout: 30m
\* InjectBugNoWait skips wait_event_idle in cancel sync. Previously this
\* cfg expected NoGrantDuringCallback violation, but the race was a model
\* artifact: ServerCancel incorrectly awaited h_fl_CANCEL instead of
\* h_fl_BL_DONE. Fixed 2026-03-13: the cancel RPC is only sent after
\* the synchronous writeback completes (osc_cache_writeback_range hp=1),
\* so the server cannot race ahead of the callback.
SPECIFICATION Spec

CONSTANTS
    InjectBug8391 = FALSE
    InjectBug8246 = FALSE
    InjectBug6416 = FALSE
    InjectBugNoWait = TRUE
    InjectBugNoRestart = FALSE

INVARIANTS
    TypeOK
    NoDoubleServerGrant
    NoDoubleClientGrant
    ServerPoolCorrect
    ClientPoolCorrect
    FlagConsistency
    CancelCallbackOnce
    BLDoneImpliesCancel
    NoCancelledOnWaiting
    NoGrantWhileHeld
    CancelPostCondition
    TotalGrantCorrect
    GrantBalanced
    \* Cross-cutting invariants
    NoGrantWhileBLASTPending
    NoGrantDuringCallback
    CancelImpliesNotWaiting
    BLDoneBeforeClientGrant

CHECK_DEADLOCK FALSE
