\* @model: dne_striped_dir_ops
\* @lu:
\* @constant: EnableCrash = TRUE
\* @expect: pass
\* @violated:
\* @timeout: 30m
\* @description: Crash during concurrent mkdir+rmdir with recovery - tests mixed-op atomicity
SPECIFICATION Spec

\* Crash between Phase1 and Phase2 during concurrent mkdir and rmdir.
\* Recovery must correctly re-drive both operations to maintain
\* consistent entry counts.

CONSTANTS
    Op1Type = "mkdir"
    Op2Type = "rmdir"
    Op1MasterMdt = 1
    Op1RemoteMdt = 2
    Op2MasterMdt = 1
    Op2RemoteMdt = 2
    InjectBugLockOrder = FALSE
    InjectBugNoRecovery = FALSE
    InjectBugPartialPhase1 = FALSE
    EnableCrash = TRUE

INVARIANTS
    TypeOK
    NoLocksHeldByDone
    EntryCountConsistent
    NoOrphansAfterRecovery

PROPERTIES
    Termination
