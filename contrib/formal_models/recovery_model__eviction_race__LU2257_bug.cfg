\* @model: recovery_model
\* @lu: 2257
\* @constant: MaxRequests=2, MaxTransno=3, MaxEpoch=2, InjectEvictionRace=TRUE
\* @expect: fail
\* @violated: NoEvictionDuringReplay
\* @description: Bug D -- eviction during REPLAY: two coupled sub-bugs inject
\*               an eviction-timer race.  (1) ServerAcceptReconnect does not
\*               atomically cancel the eviction timer when accepting the client
\*               (srv_evict_pending stays TRUE after reconnect).  (2) The
\*               ~srv_connected guard is removed from ServerEvictClient,
\*               allowing eviction to fire while the client is connected.
\*               NoEvictionDuringReplay (cli_state="REPLAY" => ~srv_evict_pending)
\*               fires in the state where cli_state="REPLAY" and
\*               srv_evict_pending=TRUE.
\*               Real LU: LU-2257 -- "eviction from MDT during recovery":
\*               client evicted while actively recovering; server log shows
\*               "1 was evicted" despite client having established a connection.
SPECIFICATION Spec

CONSTANTS
    MaxRequests = 2
    MaxTransno = 3
    MaxEpoch = 2
    InjectDoubleReplay = FALSE
    InjectEpochBypass = FALSE
    InjectEarlyExit = FALSE
    InjectEvictionRace = TRUE

INVARIANTS
    TypeOK
    ReplayedEpochMatch
    NoDoubleReplay
    ClientEpochBound
    ReplayImpliesRecovering
    RecoveryPreservesCommits
    NoReplayOfUnsent
    NoEvictionDuringReplay

PROPERTIES
    EventuallyDone

