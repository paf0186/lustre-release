\* @model: dne_striped_dir_ops
\* @lu:
\* @constant:
\* @expect: pass
\* @violated:
\* @timeout: 30m
\* @description: Concurrent cross-MDT mkdir and link, correct locking, no crash
SPECIFICATION Spec

\* Tests concurrent mkdir (create dir on remote) and link (hardlink
\* to remote) operations with correct lock ordering.

CONSTANTS
    Op1Type = "mkdir"
    Op2Type = "link"
    Op1MasterMdt = 1
    Op1RemoteMdt = 2
    Op2MasterMdt = 2
    Op2RemoteMdt = 1
    InjectBugLockOrder = FALSE
    InjectBugNoRecovery = FALSE
    InjectBugPartialPhase1 = FALSE
    EnableCrash = FALSE

INVARIANTS
    TypeOK
    NoLocksHeldByDone
    EntryCountConsistent
    NoNegativeEntries

PROPERTIES
    Termination
