\* violation first -- NoLockOrderInversion trips as soon as the cancel
\* thread waits for res_lock while holding ns_lock; NoDeadlock (and
\* NoPR14Deadlock) are also violated on their own, a few steps deeper.
SPECIFICATION Spec

CONSTANTS
    InjectBugConvertNsNested = TRUE
    InjectBugCancelNested = TRUE
    InjectBugWaitExpNested = FALSE

INVARIANTS
    TypeOK
    NoDeadlock
    NoLockOrderInversion
    NoPR14Deadlock

CHECK_DEADLOCK FALSE
