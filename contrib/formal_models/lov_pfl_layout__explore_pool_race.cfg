\* @model: lov_pfl_layout
\* @expect: fail
\* @violated: NoWriteToRemovedTarget
\* @description: Exploration -- pool membership race during PFL I/O.
\*               No bugs injected; this tests whether the existing code
\*               has a race where a writer targets a PFL component whose
\*               backing OST is removed from the pool mid-I/O.
\*               The pool changer operates outside the layout lock
\*               (lu_tgt_pool_remove uses pool->op_rw_sem, not lo_type_guard),
\*               so the writer can select component 1 as its target, then
\*               the pool changer removes that OST, and the writer proceeds
\*               to write to a target no longer in the pool.
\*               Expected: FAIL -- the model finds a trace where the writer
\*               writes to a removed pool target.
SPECIFICATION Spec

CONSTANTS
    InjectBug9839 = FALSE
    InjectBug18435 = FALSE
    NumComponents = 2

INVARIANTS
    TypeOK
    NoWriteToRemovedTarget

PROPERTIES
    AllComplete

CHECK_DEADLOCK FALSE
