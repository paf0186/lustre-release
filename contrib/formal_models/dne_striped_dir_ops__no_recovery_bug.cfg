\* @model: dne_striped_dir_ops
\* @lu:
\* @constant: InjectBugNoRecovery = TRUE, EnableCrash = TRUE
\* @expect: fail
\* @violated: NoOrphansAfterRecovery
\* @timeout: 30m
\* @description: Crash with no recovery - orphaned entries remain, master committed but remote not
SPECIFICATION Spec

\* When crash occurs between Phase1 and Phase2 and recovery is
\* skipped, the master side has committed changes but the remote
\* side has not. This leaves orphaned/dangling directory entries.

CONSTANTS
    Op1Type = "mkdir"
    Op2Type = "mkdir"
    Op1MasterMdt = 1
    Op1RemoteMdt = 2
    Op2MasterMdt = 2
    Op2RemoteMdt = 1
    InjectBugLockOrder = FALSE
    InjectBugNoRecovery = TRUE
    InjectBugPartialPhase1 = FALSE
    EnableCrash = TRUE

INVARIANTS
    TypeOK
    NoLocksHeldByDone
    NoOrphansAfterRecovery

PROPERTIES
    Termination
