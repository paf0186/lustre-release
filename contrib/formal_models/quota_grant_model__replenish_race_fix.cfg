\* @model: quota_grant_model
\* @expect: pass
\* @constant: InjectBugReplenishRace = FALSE
\* @description: Fix - QMT uses confirmed qmt_granted only; pending reclaims do not
\*               inflate available headroom
\* @states: 5M
\* @timeout: 10m
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Client1 = Client1
    Client2 = Client2
    Clients = {Client1, Client2}
    QMT_LIMIT = 20
    MAX_CLIENT_GRANT = 8
    MAX_INUSE = 4
    SOFT_LIMIT = 0
    ADMIN_LIMIT = 20
    QMT_SOFT_LIMIT = 0
    EnableRebalance = FALSE
    InjectBugReplenishRace = FALSE
    InjectBugRebalanceDouble = FALSE
    InjectBugRebalanceLoss = FALSE
    InjectBugGraceEnforce = FALSE
    InjectBugUncheckedAcquire = FALSE
    InjectBugStaleGrant = FALSE
    InjectBugSoftLimit = FALSE
    InjectBugBrwSync = FALSE

SYMMETRY Symmetry

INVARIANTS
    HardLimitInvariant
    ConservationInvariant
    NonNegative
    InUseBounded
