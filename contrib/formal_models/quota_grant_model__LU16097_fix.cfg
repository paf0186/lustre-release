\* @model: quota_grant_model
\* @lu: 16097
\* @expect: pass
\* @constant: InjectBugStaleGrant = FALSE
\* @description: Fix - QMT respects the admin-set ADMIN_LIMIT=10 as the effective ceiling
\*               for new grants; total grants never exceed the reduced limit
\* @states: 5M
\* @timeout: 10m
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Client1 = Client1
    Client2 = Client2
    Clients = {Client1, Client2}
    QMT_LIMIT = 20
    MAX_CLIENT_GRANT = 8
    MAX_INUSE = 4
    SOFT_LIMIT = 0
    ADMIN_LIMIT = 10
    QMT_SOFT_LIMIT = 0
    EnableRebalance = FALSE
    InjectBugReplenishRace = FALSE
    InjectBugRebalanceDouble = FALSE
    InjectBugRebalanceLoss = FALSE
    InjectBugGraceEnforce = FALSE
    InjectBugUncheckedAcquire = FALSE
    InjectBugStaleGrant = FALSE
    InjectBugSoftLimit = FALSE
    InjectBugBrwSync = FALSE

SYMMETRY Symmetry

INVARIANTS
    AdminLimitInvariant
    ConservationInvariant
    NonNegative
    InUseBounded
