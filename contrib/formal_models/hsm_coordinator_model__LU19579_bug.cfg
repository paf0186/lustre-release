\* @model: hsm_coordinator_model
\* @lu: 19579
\* @constant: InjectLU19579 = TRUE
\* @expect: fail
\* @violated: StartedHasAgent
\* @description: LU-19579 bug: recovery loop skips STARTED actions on MDT failover.
\*               FailoverOccur clears req_agent for STARTED requests (connection lost);
\*               RecoverActions (with bug) leaves req_state=STARTED, req_agent="none".
\*               After recovery: mdt_active=TRUE, req_state=STARTED, req_agent="none"
\*               => StartedHasAgent violated. These requests hang forever (no agent
\*               can deliver completion; coordinator won't re-dispatch STARTED).
SPECIFICATION Spec

CONSTANTS
    NumRequests = 2
    NumFids = 2
    InjectLU19579 = TRUE
    InjectLU19829 = FALSE

INVARIANTS
    TypeOK
    NoDoneRedispatch
    CanceledNoAgent
    StartedHasAgent
    NoStartedAfterRecovery

